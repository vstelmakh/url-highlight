name: 'Checks'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 0'

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  anchors: # This job is used to hold the anchors (reusable configurations). Expected not to run.
    if: false
    name: 'Anchors (expected to skip)'
    strategy:
      matrix: &php_version_matrix
        php: ['8.4', '8.5', '8.6']
        composer: ['latest']
        include:
          - php: '8.4' # lowest supported PHP version
            composer: 'lowest'
    runs-on: &runs_on 'ubuntu-latest'
    steps:
      - &step_checkout
        name: 'Git Checkout'
        uses: actions/checkout@v7
      - &step_setup_main
        name: 'Setup PHP and Composer'
        uses: ./.github/actions/setup
        with:
          php_version: '8.5' # main PHP version
          composer_prefer: 'latest'
          persist_cache: 'false'
      - &step_setup_matrix
        name: 'Setup PHP and Composer'
        uses: ./.github/actions/setup
        with:
          php_version: ${{ matrix.php }}
          composer_prefer: ${{ matrix.composer }}
          persist_cache: 'true'

  phpcs:
    name: 'Code Style'
    runs-on: *runs_on
    steps:
      - *step_checkout
      - *step_setup_main
      - name: 'Run PHP CS Fixer'
        run: make phpcs

  phpstan:
    name: 'Static Analysis'
    runs-on: *runs_on
    steps:
      - *step_checkout
      - *step_setup_main
      - name: 'Run PHPStan'
        run: make phpstan

  phpunit:
    name: 'Tests'
    runs-on: *runs_on
    strategy:
      matrix: *php_version_matrix
    steps:
      - *step_checkout
      - *step_setup_matrix
      - name: 'Run PHPUnit'
        run: make phpunit-coverage

  dist_check:
    name: 'Distribution Check'
    runs-on: *runs_on
    steps:
      - *step_checkout
      - *step_setup_main
      - name: 'Run Distribution Check'
        run: make dist-check

  phpbench:
    name: 'Benchmarks'
    runs-on: *runs_on
    steps:
      - *step_checkout
      - *step_setup_main
      - name: 'Run PHPBench (base)'
        id: baseline
        if: github.ref_name != 'main' # nothing to compare against on main itself
        continue-on-error: true
        run: |
          BASE_REF=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'main' }}
          git fetch --depth=1 origin $BASE_REF
          git checkout --detach FETCH_HEAD
          composer update --prefer-dist --no-progress --no-interaction
          make phpbench-baseline
      - name: 'Run PHPBench (current)'
        run: |
          git checkout --detach ${{ github.sha }}
          composer update --prefer-dist --no-progress --no-interaction
          if [ "${{ steps.baseline.outcome }}" = "failure" ]; then
            echo "::warning title=Benchmark baseline failed::Skipping benchmark comparison."
          fi
          make ${{ steps.baseline.outcome == 'success' && 'phpbench-compare' || 'phpbench' }}
